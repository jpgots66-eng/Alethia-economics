<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signal DX Lite | Alethia Company Health Check</title>
<style>
  :root {
    --navy: #1F3864;
    --navy-dark: #14264A;
    --accent: #C0782E;
    --confirmed: #C0392B;
    --partial: #B7950B;
    --clean: #1E8449;
    --bg: #F7F6F3;
    --card: #FFFFFF;
    --border: #DDD8CF;
    --text: #2B2A28;
    --text-muted: #6B6862;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 32px 20px 80px;
    min-height: 100vh;
  }
  .brand {
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--navy);
    font-weight: 600;
    margin-bottom: 8px;
  }
  h1 {
    font-size: 26px;
    font-weight: 700;
    color: var(--navy);
    margin: 0 0 12px;
  }
  h2 {
    font-size: 19px;
    font-weight: 600;
    color: var(--navy);
    margin: 0 0 16px;
  }
  p { margin: 0 0 14px; color: var(--text); }
  .muted { color: var(--text-muted); font-size: 14px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 28px 24px;
    margin-top: 20px;
  }
  .progress-track {
    height: 5px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 24px;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.3s ease;
  }
  .options { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
  .opt-btn {
    text-align: left;
    padding: 14px 16px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    background: #fff;
    font-size: 15px;
    color: var(--text);
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .opt-btn:hover { border-color: var(--accent); background: #FDF8F2; }
  .opt-btn.selected { border-color: var(--navy); background: #EAEFF7; font-weight: 600; }
  .nav-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 28px;
  }
  button.primary {
    background: var(--navy);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 13px 26px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button.primary:hover { background: var(--navy-dark); }
  button.primary:disabled { background: #B5BAC4; cursor: not-allowed; }
  button.ghost {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 14px;
    cursor: pointer;
    padding: 10px;
  }
  button.ghost:hover { color: var(--text); }
  .start-btn {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 15px 30px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
  }
  .start-btn:hover { background: #A6631F; }
  .q-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .section-score-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 16px;
  }
  .section-name { flex: 0 0 170px; font-size: 14px; font-weight: 600; }
  .bar-track {
    flex: 1;
    height: 10px;
    background: var(--border);
    border-radius: 5px;
    overflow: hidden;
  }
  .bar-fill { height: 100%; border-radius: 5px; }
  .score-num { flex: 0 0 42px; text-align: right; font-size: 14px; font-weight: 700; }
  .overall-box {
    text-align: center;
    padding: 20px;
    background: var(--navy);
    color: #fff;
    border-radius: 10px;
    margin-bottom: 24px;
  }
  .overall-num { font-size: 44px; font-weight: 700; line-height: 1; }
  .overall-label { font-size: 13px; text-transform: uppercase; letter-spacing: 0.1em; opacity: 0.85; margin-top: 6px; }
  .finding {
    border-left: 4px solid var(--border);
    padding: 10px 0 10px 14px;
    margin-bottom: 12px;
  }
  .finding.confirmed { border-color: var(--confirmed); }
  .finding.partial { border-color: var(--partial); }
  .finding-tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 2px 8px;
    border-radius: 4px;
    margin-bottom: 6px;
  }
  .finding.confirmed .finding-tag { background: #FBEAE8; color: var(--confirmed); }
  .finding.partial .finding-tag { background: #FBF4DE; color: var(--partial); }
  .finding-name { font-weight: 700; font-size: 15px; margin-bottom: 3px; }
  .finding-text { font-size: 14px; color: var(--text-muted); }
  .cta-box {
    background: #FDF8F2;
    border: 1.5px solid var(--accent);
    border-radius: 10px;
    padding: 24px;
    text-align: center;
    margin-top: 28px;
  }
  .cta-box h2 { margin-bottom: 8px; }
  a.cta-btn {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    border-radius: 8px;
    padding: 14px 28px;
    font-weight: 700;
    font-size: 15px;
    margin-top: 14px;
  }
  a.cta-btn:hover { background: #A6631F; }
  .clean-note {
    font-size: 14px;
    color: var(--clean);
    background: #EAF5EC;
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 12px;
  }
  input[type="text"], input[type="email"] {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    margin-bottom: 12px;
    font-family: inherit;
  }
  label.field-label { font-size: 13px; font-weight: 600; color: var(--navy); display: block; margin-bottom: 4px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ===================== DATA ===================== */

const GATING = [
  { id: "g1", label: "About how big is the company?",
    options: ["Under $250K a year", "$250K to $1M", "$1M to $3M", "$3M to $10M", "$10M or more"] },
  { id: "g2", label: "How long has the company been operating?",
    options: ["Under 2 years", "2 to 5 years", "5 to 15 years", "15+ years"] },
  { id: "g3", label: "How is ownership structured?",
    options: ["Just me", "Me plus one partner", "Three or more partners or investors"] },
  { id: "g4", label: "How would you describe leadership today?",
    options: ["It's just me wearing every hat", "Me plus a couple key people", "A real leadership team", "A professional CEO or C-suite"] },
  { id: "g5", label: "Which best describes the business?",
    options: ["Products / retail / consumer goods", "Services / consulting / agency", "Construction / trades / field services",
              "Healthcare / wellness", "Food & beverage", "Technology / software", "Something else"] },
  { id: "g6", label: "Which of these feels closest to what's actually slowing you down right now?",
    options: ["Sales & Leads", "Fulfillment & Capacity", "Money & Margins", "People & Culture", "Leadership & Decisions", "Not sure"] },
];

const BUCKETS = ["Sales & Leads", "Fulfillment & Capacity", "Money & Margins", "People & Culture", "Leadership & Decisions"];

// fracture#, name, bucket
const FRACTURES = [
  { n: 1, name: "Founder-monopolized operations", bucket: "Fulfillment & Capacity" },
  { n: 2, name: "Fulfillment concentration risk", bucket: "Fulfillment & Capacity" },
  { n: 3, name: "No decision architecture", bucket: "Leadership & Decisions" },
  { n: 4, name: "Unpredictable revenue engine", bucket: "Sales & Leads" },
  { n: 5, name: "Unmonetized strategic partnerships", bucket: "Sales & Leads" },
  { n: 6, name: "Value-based pricing failure", bucket: "Money & Margins" },
  { n: 7, name: "Operational infrastructure gaps", bucket: "Fulfillment & Capacity" },
  { n: 8, name: "Positioning / ICP misalignment", bucket: "Sales & Leads" },
  { n: 9, name: "Culture & hiring without a system", bucket: "People & Culture" },
  { n: 10, name: "No execution cadence / scorecard", bucket: "Leadership & Decisions" },
  { n: 11, name: "Ownership alignment", bucket: "Leadership & Decisions", conditional: true },
];

const LIGHT_COPY = {
  1: "Right now, if you stepped away for two weeks, most of what makes this business run would stop with you.",
  2: "A single person, vendor, or crew failure could seriously disrupt your ability to deliver, with no real backup in place.",
  3: "Too many decisions still have to come through you personally, even ones your team could likely handle.",
  4: "Your pipeline runs more on relationships and luck than on a system you control, which makes growth hard to plan around.",
  5: "You likely have referral or partnership relationships that could be driving a lot more business than they currently are.",
  6: "Your pricing may not be capturing the full value you deliver, often bundled invisibly into materials and labor.",
  7: "Core processes still live in people's heads rather than in writing, which makes the business fragile to any change in the team.",
  8: "Your marketing may be attracting more price-comparison shoppers than the clients you actually want.",
  9: "Hiring and culture decisions may be running more on instinct than on a documented standard, a risk as you grow.",
  10: "There's no regular rhythm for reviewing the numbers that actually indicate the health of the business.",
  11: "You and your partner(s) may not have explicitly aligned on what success looks like individually, a gap that tends to surface at the worst time.",
};

// question bank: id, fracture, bucket, text, options[0..3]
const QUESTIONS = [
  { id: "Q1a", f: 1, text: "If your revenue doubled overnight, what would break first?",
    opts: ["Absorb it with current systems", "Strain but manage", "Struggle significantly", "Everything routes through me and breaks immediately"] },
  { id: "Q1b", f: 1, text: "What share of your week is spent on tasks only you can do, vs. tasks someone else could do if trained?",
    opts: ["Under 25%", "25 to 50%", "50 to 75%", "Over 75%"] },
  { id: "Q2a", f: 2, text: "Is there one person, crew, or vendor that, if you lost them tomorrow, would seriously disrupt your ability to deliver?",
    opts: ["No single point of failure", "Minor disruption, recoverable", "Significant disruption", "Business-threatening, no backup"] },
  { id: "Q2b", f: 2, text: "How many people on your team could independently run a job or deliver your core service without you present?",
    opts: ["Most of the team", "A few", "One, maybe", "Only me"] },
  { id: "Q3a", f: 3, text: "When a client asks for a mid-project change, how many people on your team can approve it without checking with you first?",
    opts: ["Most people, within limits", "A couple people", "One person, rarely", "No one, everything comes to me"] },
  { id: "Q3b", f: 3, text: "Do you have written thresholds for what your team can decide on their own vs. what must come to you?",
    opts: ["Yes, documented and used", "Documented but not really used", "Informal understanding only", "No, it's all in my head"] },
  { id: "Q4a", f: 4, text: "In the last 90 days, what share of new business came from a source you actively control, vs. word of mouth or luck?",
    opts: ["Mostly controlled / predictable", "About half", "Mostly word of mouth", "Entirely word of mouth"] },
  { id: "Q4b", f: 4, text: "Do you track what it actually costs you to win a new customer?",
    opts: ["Yes, tracked and reviewed", "Roughly, informally", "Not really", "No idea"] },
  { id: "Q5a", f: 5, text: "Do you have any formal, structured referral relationships with complementary businesses in your space?",
    opts: ["Yes, structured with tracked results", "A few informal ones", "One or two, unstructured", "None"] },
  { id: "Q5b", f: 5, text: "If a referral partner sent you five deals this year, would you know it?",
    opts: ["Yes, precisely", "Roughly", "Probably not", "No way to know"] },
  { id: "Q6a", f: 6, text: "Do you charge separately for your own time, expertise, and coordination, or is it bundled invisibly into materials and labor?",
    opts: ["Charged / itemized separately", "Partially itemized", "Rarely itemized", "Never charged for separately"] },
  { id: "Q6b", f: 6, text: "Have you raised prices in the last 12 months specifically because you reassessed the value you provide, not just rising costs?",
    opts: ["Yes, deliberately", "Small adjustment", "Only to cover cost increases", "Prices haven't changed"] },
  { id: "Q7a", f: 7, text: "If a new hire started tomorrow, is there a written process for your core work, or would they need you to explain it?",
    opts: ["Fully documented", "Partially documented", "Only the basics written down", "Lives entirely in people's heads"] },
  { id: "Q7b", f: 7, text: "Are your sales, delivery, and invoicing processes written down anywhere?",
    opts: ["Yes, all three", "Two of the three", "One of the three", "None written down"] },
  { id: "Q8a", f: 8, text: "When someone calls just to compare your price against competitors, how often do you still win the job?",
    opts: ["Usually win", "Win about half", "Rarely win", "Almost never win"] },
  { id: "Q8b", f: 8, text: "Does your current marketing attract the client you actually want, or does it mostly attract price-shoppers?",
    opts: ["Attracts ideal clients", "Mixed", "Mostly price-shoppers", "Almost entirely price-shoppers"] },
  { id: "Q9a", f: 9, text: "Do you have documented values or standards you hire against, or is it mostly gut feel?",
    opts: ["Documented and used in hiring", "Loosely documented", "Mostly gut feel, some structure", "Pure gut feel"] },
  { id: "Q9b", f: 9, text: "In the last two years, has anyone you trained left to compete directly against you?",
    opts: ["No", "Once, minor impact", "More than once", "This happens regularly"] },
  { id: "Q10a", f: 10, text: "Do you have a regular (weekly or monthly) meeting where you review a fixed set of numbers against a plan?",
    opts: ["Yes, consistently", "Sometimes", "Rarely", "Never"] },
  { id: "Q10b", f: 10, text: "If asked right now for the 5 to 8 numbers that tell you the health of your business, could you produce them from memory?",
    opts: ["Yes, immediately", "Most of them", "One or two", "No"] },
  { id: "Q11a", f: 11, text: "Have you and your partner(s) ever explicitly written down what success looks like for each of you individually, not just for the business?",
    opts: ["Yes, documented", "Discussed but not documented", "Touched on briefly", "Never discussed"] },
  { id: "Q11b", f: 11, text: "If one of you wanted to sell in 3 years and the other wanted to hold for 15, would you already know that about each other?",
    opts: ["Yes, confidently", "Think so", "Not sure", "No idea"] },
];

/* ===================== STATE ===================== */

let state = {
  screen: "intro",
  gatingIdx: 0,
  gatingAnswers: {},
  coreQueue: [],
  coreIdx: 0,
  coreAnswers: {},
  contact: { name: "", email: "", company: "" },
};

function buildCoreQueue() {
  const chosenBucket = GATING[5].options[state.gatingAnswers.g6];
  const multiOwner = state.gatingAnswers.g3 !== undefined && state.gatingAnswers.g3 >= 1;
  const queue = [];
  FRACTURES.forEach(fr => {
    if (fr.conditional && !multiOwner) return;
    const deep = (chosenBucket !== "Not sure" && fr.bucket === chosenBucket);
    const qs = QUESTIONS.filter(q => q.f === fr.n);
    if (deep) {
      queue.push(qs[0], qs[1]);
    } else {
      queue.push(qs[0]);
    }
  });
  return queue;
}

/* ===================== RENDER ===================== */

const app = document.getElementById("app");

function render() {
  if (state.screen === "intro") return renderIntro();
  if (state.screen === "gating") return renderGating();
  if (state.screen === "core") return renderCore();
  if (state.screen === "contact") return renderContact();
  if (state.screen === "results") return renderResults();
}

function renderIntro() {
  app.innerHTML = `
    <div class="brand">Alethia</div>
    <h1>Company health check diagnostic</h1>
    <p>Answer a short set of questions about how the business actually runs day to day. Takes about 5 minutes. At the end you'll see exactly where the business is strong and where it's fractured, based only on what you tell us &mdash; nothing guessed, nothing filled in.</p>
    <div class="card">
      <p class="muted">6 quick setup questions, then roughly 13 to 16 targeted questions about your business. No AI, no guesswork &mdash; just your own answers, scored.</p>
      <button class="start-btn" onclick="startGating()">Start the diagnostic &rarr;</button>
    </div>
  `;
}

function startGating() { state.screen = "gating"; state.gatingIdx = 0; render(); }

function renderGating() {
  const idx = state.gatingIdx;
  const q = GATING[idx];
  const total = GATING.length;
  const pct = Math.round((idx / total) * 100);
  const selected = state.gatingAnswers[q.id];
  app.innerHTML = `
    <div class="brand">Alethia &middot; Setup</div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="q-label">Question ${idx + 1} of ${total}</div>
    <h2>${q.label}</h2>
    <div class="options" id="opts"></div>
    <div class="nav-row">
      <button class="ghost" onclick="gatingBack()" ${idx === 0 ? "disabled style='visibility:hidden'" : ""}>&larr; Back</button>
      <button class="primary" id="nextBtn" ${selected === undefined ? "disabled" : ""} onclick="gatingNext()">Continue &rarr;</button>
    </div>
  `;
  const optsDiv = document.getElementById("opts");
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt-btn" + (selected === i ? " selected" : "");
    btn.textContent = opt;
    btn.onclick = () => {
      state.gatingAnswers[q.id] = i;
      render();
    };
    optsDiv.appendChild(btn);
  });
}

function gatingBack() {
  if (state.gatingIdx > 0) { state.gatingIdx--; render(); }
}
function gatingNext() {
  if (state.gatingIdx < GATING.length - 1) {
    state.gatingIdx++;
    render();
  } else {
    state.coreQueue = buildCoreQueue();
    state.coreIdx = 0;
    state.screen = "core";
    render();
  }
}

function renderCore() {
  const idx = state.coreIdx;
  const q = state.coreQueue[idx];
  const total = state.coreQueue.length;
  const pct = Math.round(((idx + GATING.length) / (total + GATING.length)) * 100);
  const selected = state.coreAnswers[q.id];
  app.innerHTML = `
    <div class="brand">Alethia &middot; Diagnostic</div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="q-label">Question ${idx + 1} of ${total}</div>
    <h2>${q.text}</h2>
    <div class="options" id="opts"></div>
    <div class="nav-row">
      <button class="ghost" onclick="coreBack()">&larr; Back</button>
      <button class="primary" id="nextBtn" ${selected === undefined ? "disabled" : ""} onclick="coreNext()">${idx === total - 1 ? "See results" : "Continue"} &rarr;</button>
    </div>
  `;
  const optsDiv = document.getElementById("opts");
  q.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt-btn" + (selected === i ? " selected" : "");
    btn.textContent = opt;
    btn.onclick = () => {
      state.coreAnswers[q.id] = i;
      render();
    };
    optsDiv.appendChild(btn);
  });
}

function coreBack() {
  if (state.coreIdx > 0) {
    state.coreIdx--;
    render();
  } else {
    state.screen = "gating";
    state.gatingIdx = GATING.length - 1;
    render();
  }
}
function coreNext() {
  if (state.coreIdx < state.coreQueue.length - 1) {
    state.coreIdx++;
    render();
  } else {
    state.screen = "contact";
    render();
  }
}

function renderContact() {
  app.innerHTML = `
    <div class="brand">Alethia &middot; Almost there</div>
    <h2>Where should we send your results?</h2>
    <p class="muted">Your report is ready. Enter your details to view it.</p>
    <div class="card">
      <label class="field-label">Name</label>
      <input type="text" id="c-name" value="${state.contact.name}">
      <label class="field-label">Email</label>
      <input type="email" id="c-email" value="${state.contact.email}">
      <label class="field-label">Company</label>
      <input type="text" id="c-company" value="${state.contact.company}">
      <button class="primary" style="width:100%; margin-top:6px;" onclick="submitContact()">View my results &rarr;</button>
    </div>
  `;
}

function submitContact() {
  state.contact.name = document.getElementById("c-name").value;
  state.contact.email = document.getElementById("c-email").value;
  state.contact.company = document.getElementById("c-company").value;
  state.screen = "results";
  render();
}

function scoreFracture(fnum) {
  const qs = QUESTIONS.filter(q => q.f === fnum && state.coreAnswers[q.id] !== undefined);
  if (qs.length === 0) return null;
  const points = qs.reduce((sum, q) => sum + state.coreAnswers[q.id], 0);
  const max = qs.length * 3;
  const pct = points / max;
  let status = "Not Evident";
  if (pct >= 0.66) status = "Confirmed";
  else if (pct >= 0.33) status = "Partial";
  return { pct, status };
}

function scoreSection(bucket) {
  const qs = QUESTIONS.filter(q => {
    const fr = FRACTURES.find(f => f.n === q.f);
    return fr.bucket === bucket && state.coreAnswers[q.id] !== undefined;
  });
  if (qs.length === 0) return null;
  const points = qs.reduce((sum, q) => sum + state.coreAnswers[q.id], 0);
  const max = qs.length * 3;
  return Math.round(100 * (1 - points / max));
}

function scoreOverall() {
  const qs = QUESTIONS.filter(q => state.coreAnswers[q.id] !== undefined);
  if (qs.length === 0) return null;
  const points = qs.reduce((sum, q) => sum + state.coreAnswers[q.id], 0);
  const max = qs.length * 3;
  return Math.round(100 * (1 - points / max));
}

function barColor(score) {
  if (score >= 66) return "#1E8449";
  if (score >= 33) return "#B7950B";
  return "#C0392B";
}

function renderResults() {
  const overall = scoreOverall();
  const findings = FRACTURES
    .map(fr => ({ fr, r: scoreFracture(fr.n) }))
    .filter(x => x.r && (x.r.status === "Confirmed" || x.r.status === "Partial"))
    .sort((a, b) => b.r.pct - a.r.pct);

  const cleanCount = FRACTURES.filter(fr => {
    const r = scoreFracture(fr.n);
    return r && r.status === "Not Evident";
  }).length;

  let sectionsHtml = "";
  BUCKETS.forEach(b => {
    const s = scoreSection(b);
    if (s === null) return;
    sectionsHtml += `
      <div class="section-score-row">
        <div class="section-name">${b}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${s}%; background:${barColor(s)}"></div></div>
        <div class="score-num">${s}</div>
      </div>`;
  });

  let findingsHtml = "";
  findings.forEach(({ fr, r }) => {
    const cls = r.status === "Confirmed" ? "confirmed" : "partial";
    findingsHtml += `
      <div class="finding ${cls}">
        <div class="finding-tag">${r.status}</div>
        <div class="finding-name">${fr.name}</div>
        <div class="finding-text">${LIGHT_COPY[fr.n]}</div>
      </div>`;
  });

  app.innerHTML = `
    <div class="brand">Alethia &middot; Your results</div>
    <h1>Company health check</h1>
    <p class="muted">${state.contact.company ? state.contact.company : "Your business"} &middot; based only on the answers you gave</p>
    <div class="overall-box">
      <div class="overall-num">${overall !== null ? overall : "--"}</div>
      <div class="overall-label">Overall health score</div>

    <div class="card">
      <h2>By area</h2>
      ${sectionsHtml}

      <h2>What's showing up</h2>
      ${findings.length ? findingsHtml : '<div class="clean-note">Nothing rose to a confirmed or partial level in the areas you covered &mdash; solid signal so far.</div>'}
